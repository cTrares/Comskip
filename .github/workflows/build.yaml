name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-v4:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements-build.txt
    - name: Install pinned build dependencies
      run: python -m pip install -r requirements-build.txt
    - name: Run Python tests
      working-directory: tools/hybrid_logo
      run: python -m unittest discover -p "test_*.py"
    - name: Build comskip-final
      working-directory: tools/hybrid_logo
      run: python -m PyInstaller --noconfirm --clean comskip-final-v4.spec

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux
        - os: macos-latest
          platform: macos
        - os: windows-latest
          platform: windows-mingw
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup
      shell: bash
      run: |
        setupScript='ci/${{ matrix.platform }}/setup.sh'
        [ ! -f "$setupScript" ] || "$setupScript"

    - name: Configure Apt packages
      if: ${{ matrix.platform == 'linux' }}
      run: |
        sudo apt-get install -y autoconf libtool git build-essential libargtable2-dev libavformat-dev libswscale-dev libsdl1.2-dev

    - name: Configure Brew packages
      if: ${{ matrix.platform == 'macos' }}
      run: |
        brew install autoconf automake libtool pkgconf argtable ffmpeg sdl2

    - name: Setup msys2
      uses: msys2/setup-msys2@v2
      if: ${{ matrix.platform == 'windows-mingw' }}
      with:
        update: true
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-make
          mingw-w64-x86_64-autotools
          mingw-w64-x86_64-libtool
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-yasm
          mingw-w64-x86_64-argtable
          mingw-w64-x86_64-ffmpeg
          mingw-w64-x86_64-SDL2
    - name: Put MSYS2_MinGW64 on PATH
      if: ${{ matrix.platform == 'windows-mingw' }}
      run: |
        echo "${{ runner.temp }}/msys64/mingw64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Configure and build Posix
      if: ${{ matrix.platform != 'windows-mingw' }}
      run: |
        ./autogen.sh
        ./configure
        make

    - name: Configure and build Windows
      if: ${{ matrix.platform == 'windows-mingw' }}
      run: |
        msys2 -c './autogen.sh'
        msys2 -c './configure'
        msys2 -c 'make'
